# Load-balancing pool for the "/lb" demo below, between backend-1's and
# backend-2's first endpoint ("/"), which return equivalent responses.
# No method directive is given, so this uses NGINX's default: round
# robin, alternating strictly through the server list. Other methods
# could be used instead, e.g. `least_conn;` (send each new request to
# whichever server currently has the fewest active connections) or
# weighted round robin (`server ... weight=N;`, see "Server Weights &
# Least Connections" in the README) for backends with different
# capacity or response times.
# max_fails/fail_timeout add a passive health check: after 2 failed
# attempts to reach a server within 10s, NGINX marks it "down" and skips
# it for the next 10s instead of trying (and failing) on every request.
upstream endpoints {
    server backend-1:3000 max_fails=2 fail_timeout=10s;
    server backend-2:3000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    location / {
        root /home/student/html;
        index static.html;
        # /etc/nginx is backed by the "nginx-config" named volume in
        # compose.yaml, so the password file survives container recreation.
        #auth_basic "Basic Auth";
        #auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # Docker's embedded DNS resolves "backend-1"/"backend-2" to the right
    # container on the "lab-net" network -- no private IPs to look up or
    # keep updated, unlike the EC2 version of this exercise.
    location /Backend1end1 {
        proxy_pass http://backend-1:3000/;
    }

    location /Backend1end2 {
        proxy_pass http://backend-1:3000/test;
    }

    location /Backend2end1 {
        proxy_pass http://backend-2:3000/;
    }

    location /Backend2end2 {
        proxy_pass http://backend-2:3000/testing;
    }

    # Round-robin load balancer between backend-1's and backend-2's "/"
    # endpoint -- refreshing this repeatedly alternates the response
    # between the two containers.
    location /lb {
        proxy_pass http://endpoints/;
    }
}
