services:
  nginx:
    build:
      context: .
      target: nginx-node
    container_name: nginx
    ports:
      - "8080:80"
    # Named volumes so website content, NGINX config, and logs survive
    # `docker compose down`/`up` and image rebuilds -- without them,
    # anything written inside the container is lost once it's recreated.
    # `docker compose down -v` deletes these volumes; plain `down` keeps them.
    volumes:
      - nginx-www:/var/www
      - nginx-config:/etc/nginx
      - nginx-logs:/var/log/nginx
      # Bind mount (not a named volume): the course creates the nginx-files
      # folder in the home directory right after logging in, so it's mapped
      # here to the student user's home inside the container. Unlike the
      # named volumes above, this stays in sync with the repo folder on the
      # host -- edit static.html on either side and both see the change.
      - ./nginx-files:/home/student/nginx-files
    networks:
      - lab-net

  backend-1:
    build:
      context: .
      target: backend-node
    image: nginx-lab-backend
    container_name: backend-1
    networks:
      - lab-net

  # Reuses the image built for backend-1 instead of building it again --
  # both containers share the exact same image, just two separate
  # (essentially empty) writable layers on top.
  backend-2:
    image: nginx-lab-backend
    container_name: backend-2
    depends_on:
      - backend-1
    networks:
      - lab-net

networks:
  lab-net:

volumes:
  nginx-www:
  nginx-config:
  nginx-logs:
