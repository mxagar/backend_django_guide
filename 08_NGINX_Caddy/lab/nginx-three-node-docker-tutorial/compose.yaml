services:
  nginx:
    build:
      context: .
      target: nginx-node
    container_name: nginx
    ports:
      - "8080:80"
      # Only used by the virtual-host lab's second server block; harmless
      # to leave published while the reverse-proxy lab is active.
      - "3000:3000"
    # Named volumes so website content, NGINX config, and logs survive
    # `docker compose down`/`up` and image rebuilds -- without them,
    # anything written inside the container is lost once it's recreated.
    # `docker compose down -v` deletes these volumes; plain `down` keeps them.
    volumes:
      - nginx-www:/var/www
      - nginx-config:/etc/nginx
      - nginx-logs:/var/log/nginx
      # Bind mount (not a named volume): the course creates this folder in
      # the home directory right after logging in, so it's mapped here to
      # the student user's home inside the container. Unlike the named
      # volumes above, this stays in sync with the repo folder on the host
      # -- edit static.html on either side and both see the change.
      - ./nginx-html:/home/student/nginx-html
      #
      # The two setups below both mount a conf.d/*.conf file and an
      # html root to the *same* container paths, so only one can be
      # active at a time -- comment/uncomment the pair you want.
      #
      # Reverse proxy lab (active): one site on port 80, proxying
      # /Backend1end1, /Backend1end2, /Backend2end1, /Backend2end2 to
      # backend-1/backend-2 -- see "Reverse Proxy".
      - ./reverse-proxy-html/conf.d/reverse-proxy.conf:/etc/nginx/conf.d/site.conf
      - ./reverse-proxy-html:/home/student/html
      #
      # Virtual host lab: two server blocks (port 80 + port 3000), no
      # proxying -- see "Creating a Virtual Host". Swap it back in by
      # commenting out the reverse-proxy pair above and uncommenting these:
      # - ./virtual-host-html/conf.d/virtual.conf:/etc/nginx/conf.d/site.conf
      # - ./virtual-host-html:/home/student/html
    networks:
      - lab-net

  backend-1:
    build:
      context: .
      target: backend-node
    image: nginx-lab-backend
    container_name: backend-1
    # Local FastAPI app bind-mounted in, matching the course's app
    # directory on the backend EC2 instance -- edit main.py on the host,
    # uvicorn's --reload picks it up without rebuilding the image.
    volumes:
      - ./backend-1-app:/home/student/backend_app
    # Course opens port 3000 in the backend's AWS security group so the
    # API is reachable directly; here that's the host port published below
    # (3001, since backend-2 needs its own host port for the same 3000).
    ports:
      - "3001:3000"
    networks:
      - lab-net

  # Reuses the image built for backend-1 instead of building it again --
  # both containers share the exact same image, just two separate
  # (essentially empty) writable layers on top.
  backend-2:
    image: nginx-lab-backend
    container_name: backend-2
    volumes:
      - ./backend-2-app:/home/student/backend_app
    ports:
      - "3002:3000"
    depends_on:
      - backend-1
    networks:
      - lab-net

networks:
  lab-net:

volumes:
  nginx-www:
  nginx-config:
  nginx-logs:
